global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    cluster: eoms
    env: prod

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: eoms-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: eoms-api
          component: backend

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
        labels:
          service: prometheus
