name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  # CI 中使用的非敏感占位密钥（真实环境必须由 .env / secrets 注入）
  EOMS_SECRET_KEY: ci-secret-key-not-for-production-use-0123456789
  EOMS_ENV: dev

jobs:
  # ---------------------------------------------------------------------------
  # 1. 静态检查：ruff + mypy
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy app

  # ---------------------------------------------------------------------------
  # 2. 后端测试：独立 SQLite + 内存缓存 + 本地存储，覆盖率门槛 80%
  # ---------------------------------------------------------------------------
  test:
    name: Backend tests (coverage >= 80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pytest
        env:
          EOMS_ENV: test
        run: |
          pytest tests -q \
            --cov=app \
            --cov-report=term \
            --cov-report=xml \
            --cov-fail-under=80

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3. 前端构建
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 4. PostgreSQL 上的迁移校验
  # ---------------------------------------------------------------------------
  migrations:
    name: Alembic on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eoms
          POSTGRES_USER: eoms
          POSTGRES_PASSWORD: eoms-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eoms -d eoms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      EOMS_DATABASE_URL: postgresql+psycopg://eoms:eoms-ci-password@127.0.0.1:5432/eoms
      EOMS_REDIS_URL: ""
      EOMS_RLS_ENABLED: "false"
      EOMS_STORAGE_BACKEND: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Upgrade to head
        run: |
          alembic upgrade head
          alembic current
          alembic check

  # ---------------------------------------------------------------------------
  # 5. 镜像构建 + 容器冒烟（API 连 PostgreSQL / Redis，校验健康检查与接口）
  # ---------------------------------------------------------------------------
  docker:
    name: Docker build & smoke
    runs-on: ubuntu-latest
    needs: [lint, test, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eoms
          POSTGRES_USER: eoms
          POSTGRES_PASSWORD: eoms-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eoms -d eoms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: eoms-api:ci
          load: true
          cache-from: type=gha,scope=eoms-api
          cache-to: type=gha,mode=max,scope=eoms-api

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          tags: eoms-web:ci
          load: true
          cache-from: type=gha,scope=eoms-web
          cache-to: type=gha,mode=max,scope=eoms-web

      - name: Start API container
        run: |
          docker run -d --name eoms-api-ci --network host \
            -e EOMS_ENV=dev \
            -e EOMS_DEBUG=false \
            -e EOMS_SECRET_KEY="${EOMS_SECRET_KEY}" \
            -e EOMS_DATABASE_URL="postgresql+psycopg://eoms:eoms-ci-password@127.0.0.1:5432/eoms" \
            -e EOMS_REDIS_URL="redis://127.0.0.1:6379/0" \
            -e EOMS_CELERY_ALWAYS_EAGER=true \
            -e EOMS_STORAGE_BACKEND=local \
            -e EOMS_RLS_ENABLED=false \
            -e EOMS_TRUSTED_HOSTS='*' \
            eoms-api:ci

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/healthz >/dev/null 2>&1; then
              echo "API 已就绪（第 ${i} 次探测）"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "API 启动超时，输出容器日志："
              docker logs eoms-api-ci
              exit 1
            fi
            sleep 2
          done

      - name: Smoke checks
        run: |
          set -euo pipefail
          echo "--- /healthz"
          curl -fsS http://127.0.0.1:8000/healthz
          echo
          echo "--- /readyz"
          curl -fsS http://127.0.0.1:8000/readyz
          echo
          echo "--- /api/v1/auth/captcha"
          curl -fsS http://127.0.0.1:8000/api/v1/auth/captcha >/dev/null
          echo "captcha ok"
          echo "--- /openapi.json"
          curl -fsS http://127.0.0.1:8000/openapi.json >/dev/null
          echo "openapi ok"

      - name: Dump logs on failure
        if: failure()
        run: docker logs eoms-api-ci || true

      - name: Cleanup
        if: always()
        run: docker rm -f eoms-api-ci || true
