[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eoms"
version = "1.0.0"
description = "企业运营管理系统（EOMS）：审批 / 项目 / 供应商 / 成本 / 经营报表一体化平台"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "EOMS Team" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "PyJWT>=2.8",
    "argon2-cffi>=23.1",
    "cryptography>=42.0",
    "redis>=5.0",
    "celery>=5.3",
    "minio>=7.2",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "reportlab>=4.1",
    "Pillow>=10.3",
    "prometheus-fastapi-instrumentator>=7.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "fakeredis>=2.23",
    "types-python-dateutil>=2.9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "integration: 需要外部依赖（PostgreSQL/Redis/MinIO）的集成测试",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/tasks/*", "app/main.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["B008", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E501"]
"migrations/*" = ["E501"]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["web/", "alembic/"]
