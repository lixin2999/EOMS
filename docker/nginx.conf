# ---------------------------------------------------------------------------
# EOMS 前端与反向代理（生产）
# - SPA history fallback
# - /api、/healthz、/readyz 反向代理到 api:8000（Docker DNS 动态解析）
# - gzip、静态资源长缓存、安全响应头、32MB 上传限制
# - 生产启用 TLS 时取消 443 段注释并挂载证书
# ---------------------------------------------------------------------------
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  eoms  '$remote_addr - $request_id [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                      'rt=$request_time urt=$upstream_response_time';
    access_log  /var/log/nginx/access.log  eoms;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    server_tokens       off;
    client_max_body_size 32m;
    client_body_timeout 60s;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/json application/javascript
                      application/xml application/xml+rss image/svg+xml font/woff font/woff2;

    # Docker 内置 DNS：配合变量 proxy_pass 实现 API 副本重建后的自动重解析。
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    map $http_x_trace_id $trace_id {
        default $http_x_trace_id;
        ""      $request_id;
    }

    server {
        listen       80;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-Trace-Id $trace_id always;
        # 若前后端同域部署，可开启 CSP；接入外部 CDN 时按需放行。
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self'" always;

        # 健康检查直接打后端，便于负载均衡判断实例可用性
        location = /healthz {
            set $api_health http://api:8000;
            proxy_pass $api_health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }

        location = /readyz {
            set $api_ready http://api:8000;
            proxy_pass $api_ready;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }

        location /api/ {
            set $api_backend http://api:8000;
            proxy_pass $api_backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id      $trace_id;
            proxy_set_header Connection        "";

            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
            proxy_buffering       off;
            proxy_request_buffering off;
        }

        # 带内容哈希的构建产物长缓存
        # 注意：nginx 的 add_header 不继承自 server 块，子 location 内需重复声明安全头。
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self'" always;
            try_files $uri =404;
        }

        location = /index.html {
            add_header Cache-Control "no-store";
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self'" always;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # -----------------------------------------------------------------------
    # TLS（生产证书就绪后启用）
    # -----------------------------------------------------------------------
    # server {
    #     listen 443 ssl http2;
    #     server_name eoms.example.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     # 复用上面 80 端口的 location 配置（可抽到 include 文件）
    # }
}
